      @keyframes gpShift {
        0%{transform:translateX(-8%) translateY(-6%) scale(1)}
        50%{transform:translateX(8%) translateY(6%) scale(1.05)}
        100%{transform:translateX(-8%) translateY(-6%) scale(1)}

      .gp-bg::before{

        height:70vh;
        background:

        pointer-events:none;
        z-index:0;
      }
      .gp-bg::after{
        content:"";
        position:fixed; inset:auto -25vw -30vh -25vw;
        height:55vh;
        background:

      function safeParse(line) {
        try {
          return { ok: true, value: JSON.parse(line) };
        } catch (e) {
          return { ok: false, error: String(e) };
        }
      }

      function normalize(r, idx) {
        return {
          id: String(r?.id ?? `UNASSIGNED-${idx + 1}`),
          title: String(r?.title ?? "Untitled"),
          theme: (String(r?.theme ?? "POTPOURRI").toUpperCase() === "FOUNDATION" ? "POTPOURRI" : String(r?.theme ?? "POTPOURRI")),
          theme_confidence: String(r?.theme_confidence ?? "low"),
          prompt: String(r?.prompt ?? ""),
        };
      }

      function parseJSONL(text) {
        const lines = (text || "")
          .split(/\r?\n/)
          .map((l) => l.trim())
          .filter(Boolean);

        const records = [];
        const errors = [];
        for (let i = 0; i < lines.length; i++) {
          const p = safeParse(lines[i]);
          if (p.ok) records.push(normalize(p.value, records.length));
          else errors.push({ line: i + 1, preview: lines[i].slice(0, 200), error: p.error });
        }
        return { records, errors };
      }

      function copy(text) {
        return navigator.clipboard.writeText(text || "");

      function containsStyle(prompt, styleKey) {
        const p = (prompt || "").toLowerCase();
        const needles = {

          LITHOGRAPH: ["lithograph"],
          WATERCOLOR: ["watercolor"],

          DIGITAL: ["high-end digital", "digital painting style"],
          AGED_PRINT: ["aged print", "sepia-toned"],
          HALFTONE: ["halftone", "dot-based"],
          INK_WASH: ["ink & wash", "ink and wash"],
          INK_SPLASH: ["ink splash", "splattered ink", "ink bursts"],

          NEON_NOIR: ["neon noir", "chromatic aberration", "electric neon"],
          PAPER_CUT: ["paper cut", "shadow box", "layered paper"],
        }[styleKey] || [];

        return needles.some((n) => p.includes(n));

      //
      // You can create 5–10+ sets and the UI will randomly rotate among them.

      const FALLBACK_IMG = `data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18181b"/><stop offset="1" stop-color="#09090b"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#g)"/><text x="40" y="330" font-family="Arial, sans-serif" font-size="44" fill="rgba(255,255,255,0.55)">missing image</text></svg>`)}`;

      function pickRandom(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      // Gallery component is loaded from /gallery.js
      const Gallery = window.GP_Gallery;




      // -----------------------------
      // Gallery sets (static lookbook bundles)
      // Folder structure: /gallery/set-XX/cinematic.jpg (etc)
      // -----------------------------
      const GALLERY_SETS = [
        { key: "set-01", folder: "/gallery/set-01", recordId: "GP-FOUND-0049" },
        { key: "set-02", folder: "/gallery/set-02", recordId: "GP-PSYCHEDELIC-0057" },
        { key: "set-03", folder: "/gallery/set-03", recordId: "GP-CITIES-0005" },
        { key: "set-04", folder: "/gallery/set-04", recordId: "GP-GROCERY_SNACKS-0021" },
        { key: "set-05", folder: "/gallery/set-05", recordId: "GP-SPORTS-0003" },
        { key: "set-06", folder: "/gallery/set-06", recordId: "GP-NATURE-0116" },
        { key: "set-07", folder: "/gallery/set-07", recordId: "GP-GROCERY_SNACKS-0074" },
        { key: "set-08", folder: "/gallery/set-08", recordId: "GP-NATURE-0072" },
      ];
      function App() {
        const [status, setStatus] = useState("Loading /data.jsonl …");
        const [records, setRecords] = useState([]);
        const [errors, setErrors] = useState([]);

        // controls
        const [theme, setTheme] = useState("ALL");
        const avoidRepeats = true; // v1.2 baked-in

        // style control (default CINEMATIC, -none- last)
        const [styleKey, setStyleKey] = useState("CINEMATIC");

        // v1.2 state
        useEffect(() => {
          const s = resolveSkin(styleKey);
          setSkin(s);
          const el = document.getElementById("gp-skin-bg");
          if (el) {
            if (s?.bg) {
              el.style.backgroundImage = `url(${s.bg}), url(/skins/cinematic/bg-01.png)`;
              el.classList.add("is-on");
            } else {
              el.style.backgroundImage = "";
              el.classList.remove("is-on");
            }
          }
        }, [styleKey]);
        const [current, setCurrent] = useState(null);
        const [history, setHistory] = useState([]); // ids used
        const [historyIdx, setHistoryIdx] = useState(-1);

        // lightweight toasts for copy actions
        const [toast, setToast] = useState("");
        const toastTimer = useRef(null);
        const [logoVariant, setLogoVariant] = useState(() => pickRandom(LOGO_VARIANTS));
        const [skin, setSkin] = useState(() => resolveSkin("CINEMATIC"));

        // Gallery set (rotates through 5–10+ hosted sets)
        const [activeSetKey, setActiveSetKey] = useState(() => {
          return (typeof GALLERY_SETS !== "undefined" && GALLERY_SETS.length) ? GALLERY_SETS[0].key : "set-01";
        });
        function showToast(msg) {
          setToast(msg);
          if (toastTimer.current) clearTimeout(toastTimer.current);
          toastTimer.current = setTimeout(() => setToast(""), 1400);
        }

        function shuffleLogo() {
          setLogoVariant(pickRandom(LOGO_VARIANTS));
          const s = resolveSkin(styleKey);
          setSkin(s);
          const el = document.getElementById("gp-skin-bg");
          if (el) {
            if (s?.bg) {
              el.style.backgroundImage = `url(${s.bg}), url(/skins/cinematic/bg-01.png)`;
              el.classList.add("is-on");
            } else {
              el.style.backgroundImage = "";
              el.classList.remove("is-on");
            }
          }
        }

        function shuffleGallery() {
  if (typeof GALLERY_SETS === "undefined" || !GALLERY_SETS.length) return;
  setActiveSetKey(pickRandom(GALLERY_SETS).key);
}

        // persist a couple of settings for visitors
        useEffect(() => {
          try {
            const raw = localStorage.getItem("gp_settings_v12");
            if (raw) {
              const s = JSON.parse(raw);
              if (s?.theme) setTheme(s.theme);              if (s?.styleKey) setStyleKey(s.styleKey);
            }
          } catch {}
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, []);

        useEffect(() => {
          try {            localStorage.setItem(
              "gp_settings_v12",
              JSON.stringify({ theme, styleKey })
            );
          } catch {}
        }, [theme, styleKey]);

        // load data.jsonl
        useEffect(() => {
          (async () => {
            try {
              const res = await fetch("/data.jsonl", { cache: "no-store" });
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              const txt = await res.text();
              const parsed = parseJSONL(txt);
              setRecords(parsed.records);
              setErrors(parsed.errors);

              if (parsed.errors.length) {
                setStatus(`Loaded ${parsed.records.length} prompts with ${parsed.errors.length} parse error(s).`);
              } else {
                setStatus(`Loaded ${parsed.records.length} prompts.`);
              }

              if (parsed.records.length && parsed.errors.length === 0) {
                setTimeout(() => generateFrom(parsed.records), 0);
              }
            } catch (e) {
              setStatus("Could not load /data.jsonl. Make sure data.jsonl is deployed next to index.html.");
            }
          })();
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, []);

        const themes = useMemo(() => {
          const set = new Set(records.map((r) => r.theme).filter(Boolean));
          return ["ALL", ...Array.from(set).sort((a, b) => a.localeCompare(b))];
        }, [records]);

        const pool = useMemo(() => {
          if (!records.length) return [];
          if (theme === "ALL") return records;

          return records.filter((r) => (r.theme || "").toLowerCase() === theme.toLowerCase());
        }, [records, theme]);

        function formatPrompt(r) {
          if (!r) return "";
          let out = r.prompt || "";

          if (styleKey !== "(none)") {
            if (!containsStyle(out, styleKey)) {
              out = `${out}\n\n${STYLE[styleKey]}`;
            }
          }

          return out;
        }

        function pushHistory(id) {
          const base = historyIdx >= 0 ? history.slice(0, historyIdx + 1) : [];
          const next = [...base, id];
          setHistory(next);
          setHistoryIdx(next.length - 1);
        }

        function randomStyle() {
          // NEVER pick "-none-" when randomizing styles
          const pool = STYLE_MENU.map((m) => m.key).filter((k) => k !== "(none)");
          return pool[Math.floor(Math.random() * pool.length)];
        }

        function randomPromptAndStyle() {
          if (!records.length || errors.length > 0) return;
          // force full DB
          setTheme("ALL");
                    setStyleKey(randomStyle());
          shuffleLogo();
          shuffleGallery();
          generateFrom(records);
        }

        function generateFrom(recs = records, opts = {}) {
          if (!recs.length) return;

          // compute pool from supplied recs
          let p = recs;
          if (theme !== "ALL") {
            p = recs.filter((r) => (r.theme || "").toLowerCase() === String(themeToUse).toLowerCase());
          }

          if (!p.length) {
            setCurrent(null);
            return;
          }

          const used = new Set(history);
          let picked = null;

          if (avoidRepeats && used.size < p.length) {
            let guard = 0;
            while (!picked && guard < 4000) {
              const idx = Math.floor(Math.random() * p.length);
              const cand = p[idx];
              if (!used.has(cand.id)) picked = cand;
              guard++;
            }
          }

          if (!picked) {
            const idx = Math.floor(Math.random() * p.length);
            picked = p[idx];
          }

          setCurrent(picked);
          pushHistory(picked.id);
          shuffleLogo();
          shuffleGallery();
        }

        function goBack() {
          if (historyIdx <= 0) return;
          const newIdx = historyIdx - 1;
          setHistoryIdx(newIdx);
          const id = history[newIdx];
          const r = records.find((x) => x.id === id);
          if (r) setCurrent(r);
        }

        function goForward() {
          if (historyIdx >= history.length - 1) return;
          const newIdx = historyIdx + 1;
          setHistoryIdx(newIdx);
          const id = history[newIdx];
          const r = records.find((x) => x.id === id);
          if (r) setCurrent(r);
        }

        const canBack = historyIdx > 0;
        const canForward = historyIdx >= 0 && historyIdx < history.length - 1;

        // keyboard shortcuts (nice for visitors)
        useEffect(() => {
          function onKey(e) {
            if (e.target && ["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) return;
            if (e.key === " " || e.key === "Enter") {
              e.preventDefault();
              if (records.length && errors.length === 0) generateFrom(records);
            }
            if (e.key === "ArrowLeft") goBack();
            if (e.key === "ArrowRight") goForward();
          }
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, [records, errors, historyIdx, history]);

        return (
          <div className="min-h-screen">
            {/* Top glow */}
            <div className="pointer-events-none fixed inset-x-0 -top-24 h-64 bg-gradient-to-r from-fuchsia-500/25 via-cyan-400/20 to-amber-400/20 blur-3xl" />
<main className="mx-auto max-w-6xl px-4 py-6 grid grid-cols-1 md:grid-cols-2 gap-4">
              {/* Left */}
              <section className="gp-border rounded-3xl gp-card p-6">
                <div className="flex flex-col gap-5 items-center text-center">

<div className="gp-left-logo flex items-start gap-4">
  <div className="gp-border rounded-3xl gp-card p-5 shrink-0">
    <img
      src={(skin?.logo) ? skin.logo : "/logos/cinematic.png"}
      alt=""
      className="h-64 w-64 sm:h-80 sm:w-80 object-contain"
      loading="eager"
      decoding="async"
      onError={(e) => { e.currentTarget.src = FALLBACK_IMG; }}
    />
  </div>
  <div className="min-w-0 pt-1">
    <div className="text-4xl sm:text-5xl font-extrabold leading-[1.02]">
      <span className="gp-logo"></span>
    </div>
</div>
</div>

                  <div>
                    <div className="text-2xl sm:text-3xl font-semibold tracking-wide">
                      <span className="gp-logo">The Style Studio</span>
                    </div>
                    </div>

                  <section className="gp-border rounded-3xl gp-card p-5">
                  {/* Controls */}
              
                <div className="flex flex-wrap items-end gap-3 justify-between">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 flex-1 min-w-[280px]">
                      <div>
                        <label className="text-xs text-zinc-400">Theme</label>
                        <select
                          value={theme}
                          onChange={(e) => setTheme(e.target.value)}
                          className="mt-1 w-full rounded-2xl border border-zinc-800 bg-zinc-950 px-3 py-2 text-sm outline-none focus:border-zinc-600"
                        >
                          {themes.map((t) => (
                            <option key={t} value={t}>{themeLabel(t)}</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="text-xs text-zinc-400">Style</label>
                        <select
                          value={styleKey}
                          onChange={(e) => setStyleKey(e.target.value)}
                          className="mt-1 w-full rounded-2xl border border-zinc-800 bg-zinc-950 px-3 py-2 text-sm outline-none focus:border-zinc-600"
                        >
                          {STYLE_MENU.map((m) => (
                            <option key={m.key} value={m.key}>{m.label}</option>
                          ))}
                        </select>
</div>
                    </div>

                    <div className="flex flex-col gap-2 w-full md:w-auto items-center">
  <div className="flex flex-wrap gap-2 justify-center">
    <button className="gp-btn-primary gp-generate" onClick={() => generateFrom(records)} disabled={!records.length || errors.length > 0}>✨ POP A PROMPT</button>
    <button className="gp-btn-secondary" onClick={randomPromptAndStyle} disabled={!records.length || errors.length > 0}>Random</button>
  </div>
</div>
                  </div>

                  {errors.length > 0 && (
                    <div className="rounded-2xl border border-red-900/50 bg-red-950/30 p-3">
                      <div className="text-sm font-medium text-red-200">
                        data.jsonl has parse errors ({errors.length}). Fix these lines and redeploy.
                      </div>
                      <div className="mt-2 max-h-40 overflow-auto text-xs text-red-200/90 space-y-2">
                        {errors.slice(0, 10).map((e) => (
                          <div key={e.line}>
                            <div className="font-mono">Line {e.line}: {e.preview}</div>
                            <div className="text-red-300/80">{e.error}</div>
                          </div>
                        ))}
                        {errors.length > 10 && <div className="text-red-300/80">…and {errors.length - 10} more</div>}
                      </div>
                    </div>
                  )}
                </section>
                </div>
              </section>

              {/* Output */}
              <section className="gp-border rounded-3xl gp-card p-6 relative overflow-hidden">
                <div className="relative">{!current ? (
                  <div className="text-zinc-400">
                    No prompt selected yet. Click <span className="text-zinc-100 font-medium">Generate</span>.
                  </div>
                ) : (
                  <div>
                    <div className="flex flex-col gap-3">
  <div className="flex justify-center gap-2 flex-wrap">
    <button className="gp-btn-secondary" onClick={goBack} disabled={!canBack}>&larr; Back</button>
    <button className="gp-btn-secondary" onClick={goForward} disabled={!canForward}>Forward &rarr;</button>
  </div>

  <div className="text-2xl font-semibold leading-tight tracking-wide text-center">
    <span className="gp-logo">{current.title}</span>
  </div>

  <div className="text-xs text-zinc-500 text-center">
    {historyIdx + 1}/{history.length} viewed
  </div>
</div>

{/* Details row intentionally removed for v1.2 */}

                    <pre className="mt-4 rounded-3xl border border-zinc-800 bg-zinc-950 p-4 overflow-auto shadow-inner">
                      <code className="whitespace-pre-wrap text-sm leading-6 text-zinc-100">
                        {formatPrompt(current)}
                      </code>
                    </pre>

                    <div className="mt-4 flex flex-wrap gap-2 justify-center">
                      <button
                        className="gp-btn-secondary"
                        onClick={() => copy(formatPrompt(current)).then(() => showToast("Copied prompt"))}
                      >
                        Copy Prompt
                      </button>
                      <button
                        className="gp-btn-secondary"
                        onClick={() => copy(`${current.title}
${formatPrompt(current)}`).then(() => showToast("Copied title + prompt"))}
                      >
                        Copy Title + Prompt
                      </button>
                    </div>
                  </div>
                )}

              
                </div>
</section>

              <div className="md:col-span-2 gp-border rounded-3xl gp-card p-4">                <div className="relative">
                  <Gallery sets={GALLERY_SETS} activeSetKey={activeSetKey} onShuffle={shuffleGallery} copyFn={copy} fallbackImg={FALLBACK_IMG} getRecordById={(id) => {
  const exact = records.find((r) => r.id === id);
  if (exact) return exact;
  const bySuffix = records.find((r) => r.id && r.id.endsWith(id));
  if (bySuffix) return bySuffix;
  if (typeof id === "string" && id.includes("FOUND")) {
    const alt = id.replace("FOUND", "POTPOURRI");
    return records.find((r) => r.id === alt) || null;
  }
  return null;
}} />
                </div>
              </div>

              <footer className="md:col-span-2 text-xs text-zinc-500 px-1">
                v2.2.25: JSX structure fix (closed left-panel wrapper div) • eliminates recurring &lt;/div&gt; mismatch error
              </footer>
            </main>

            {/* Toast */}
            {toast ? (
              <div className="fixed bottom-4 left-1/2 -translate-x-1/2 rounded-full border border-zinc-800 bg-zinc-950/90 px-4 py-2 text-xs text-zinc-200 shadow-lg">
                {toast}
              </div>
            ) : null}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
